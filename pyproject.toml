[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroentry"
version = "0.1.0"
description = "Default-deny sewer-entry database with shadow-entry detection by absence (DBThon 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121",          # Depends(..., scope="function"): commit before the response is sent
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30,<2.2",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "bcrypt>=4.1",
]

[project.optional-dependencies]
# pgserver ships an embedded PostgreSQL 16 wheel: no Docker or system install needed for dev/tests.
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27", "pgserver>=0.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zeroentry = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  # Starlette 1.x nags about its own TestClient's httpx backend; harmless and outside our control.
  "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
  "slow: takes more than a few seconds",
]
