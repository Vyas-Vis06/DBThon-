# Runs the whole test suite on every push and pull request.
# The OS matrix uses embedded PostgreSQL 16; a separate job uses an official PostgreSQL 16 service.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -n auto 2>&1 | tee pytest.log
      - name: Verify built wheel UI
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m venv --system-site-packages wheel-check
          wheel-check/bin/python -m pip install --no-deps --force-reinstall dist/zeroentry-*.whl
          wheel-check/bin/python scripts/check_wheel.py
      # Job logs need a GitHub sign-in; annotations do not. Put the end of a failing run where anyone can read it.
      - name: Show the failure in the run summary
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          from pathlib import Path
          tail = Path("pytest.log").read_text(errors="replace").splitlines()[-60:]
          print("::error title=pytest (last 60 lines)::" + "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail))
          EOF

  postgres-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZEROENTRY_TEST_PG_URI: postgresql://postgres:ci_disposable_only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Serial: bootstrap/reset tests deliberately change the cluster-wide ze_app test password.
      - run: python -m pytest -n 0

  browser-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser tests/browser -q
